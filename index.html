<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar TuAsesor</title>
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .alerta { background: #ffdddd; border-left: 5px solid #f44336; padding: 15px; margin-bottom: 10px; border-radius: 8px;}
        .estable { background: #ddffdd; border-left: 5px solid #4CAF50; padding: 15px; margin-bottom: 10px; border-radius: 8px;}
        h1 { color: #2c3e50; font-size: 24px;}
    </style>
</head>
<body>
    <h1>📡 Radar de Oportunidades</h1>
    <div id="radar-resultados">Cargando datos del mercado...</div>

    <script>
        // Mantener instalable la App (PWA)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // Leer los datos del cerebro (Python)
        async function cargarDatos() {
            try {
                // El '?nocache' evita que el móvil te muestre datos viejos guardados
                const respuesta = await fetch('datos.json?nocache=' + new Date().getTime());
                if (!respuesta.ok) throw new Error("Sin datos");
                
                const datos = await respuesta.json();
                let html = '';
                
                datos.forEach(activo => {
                    let clase = activo.alerta ? 'alerta' : 'estable';
                    let icono = activo.alerta ? '⚠️ ¡OPORTUNIDAD!' : '✅ Estable';
                    html += `
                        <div class="${clase}">
                            <h3>${activo.ticker}</h3>
                            <p><strong>${icono}</strong> (Caída: ${activo.caida}%)</p>
                            <p style="font-size: 14px; color: #555;">Precio actual: ${activo.precio_actual}$ | Máx(6m): ${activo.precio_max}$</p>
                        </div>
                    `;
                });
                
                document.getElementById('radar-resultados').innerHTML = html;
            } catch (error) {
                document.getElementById('radar-resultados').innerHTML = '<p><i>Esperando el primer análisis del cerebro...</i></p>';
            }
        }

        cargarDatos();
    </script>
</body>
</html>
